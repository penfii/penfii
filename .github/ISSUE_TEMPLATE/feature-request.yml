name: Feature request
description: Suggest an improvement or new capability for Penfii.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please search the existing issues to see whether the idea has already been discussed.

  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I have searched the existing issues and did not find an existing request that covers this idea.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the problem, limitation, or use case behind the request.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe the behavior or capability you would like Penfii to provide.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions or workarounds you have considered.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add examples, screenshots, references, or other context that may help evaluate the request.
