name: Bug report
description: Report a reproducible problem with Penfii.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Before opening a bug report, please search the existing issues to avoid duplicates.

  - type: checkboxes
    id: existing-issues
    attributes:
      label: Existing issues
      options:
        - label: I have searched the existing issues and did not find a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem clearly and concisely.
      placeholder: Tell us what went wrong.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the behavior you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Provide the smallest set of steps that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Penfii version or commit
      description: If known, provide the version, release, or commit you are using.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant OS, browser, Docker, database, or runtime details.
      placeholder: |
        OS:
        Browser:
        Docker:
        Other:

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Add relevant logs, screenshots, or other evidence. Please remove secrets and personal information before posting.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add anything else that may help investigate the problem.
