# What a pull request has to pass. `make check` in server/ and in client/ runs the same steps on a
# developer machine.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # rustfmt, clippy with warnings as errors, the licence check, unused dependencies and the notices file.
  server-quick:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from server/rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: make tools
      - run: make quick

  # Advisories (RustSec), licences, banned and unknown sources, from server/deny.toml.
  server-deny:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make tools
      - run: make deny

  # The whole server test suite, including the contract test against server/api/openapi.json, on
  # PostgreSQL 17 and OpenSearch with the nori plugin, in throwaway containers (the `integration`
  # target builds docker/opensearch and starts both). The migrations are database/migrations.
  server-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from server/rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: make tools
      - run: make integration || { echo "make integration failed; retrying once"; make integration; }

  # The Node version is the one the web image uses; the tests are known to behave differently on
  # other versions.
  client-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Licences
        run: node scripts/check-licenses.mjs > /dev/null
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run knip
      - run: npm test -- --maxWorkers=2 --retry=1
      - run: npm run build

  # Known vulnerabilities in the packages that ship to the browser.
  client-audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm audit --omit=dev

  # The client's copy of the API description (client/packages/contracts/openapi.json) equals
  # server/api/openapi.json. Fix: `npm run contract:sync` in client/.
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - run: node client/scripts/sync-openapi.mjs --check

  # docker/compose.yaml is valid with the settings of docker/.env.example, and all three images
  # (core-api, web, OpenSearch with nori) build from a clean checkout, the way a self-hoster builds them.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compose file
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml config --quiet
      - name: Images
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml build
      # The release ZIP's compose.yaml (docker/install) is valid and equals docker/compose.yaml except for the images;
      # the ZIP builds, and builds to the same bytes twice. Nothing is published (.github/workflows/release.yml does that).
      - name: Install package
        run: |
          docker compose --env-file docker/.env.example -f docker/install/compose.yaml config --quiet
          docker/release/check-install-compose.py
          docker/release/package.sh 0.0.0 "$RUNNER_TEMP/zip1"
          docker/release/package.sh 0.0.0 "$RUNNER_TEMP/zip2"
          cmp "$RUNNER_TEMP/zip1/penfii-v0.0.0-docker.zip" "$RUNNER_TEMP/zip2/penfii-v0.0.0-docker.zip"

  # Secrets in the whole history of the branch.
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source /repo --redact --no-banner --verbose

  # Supply chain, for exactly this commit: a CycloneDX SBOM of the source (Cargo.lock, package-lock.json) and of the
  # core-api and web images the Compose file builds, each stamped with the commit, the tag (only when the ref is a tag, which this
  # workflow does not run on: a tag push starts nothing, so a CI SBOM says `none`) and the image id and checked against the CycloneDX schema; then a container vulnerability report (Grype). The SBOM step
  # fails when an SBOM is missing, invalid or unstamped. The report only reports: findings never fail this job, and a
  # scanner that cannot fetch its database is written down as UNAVAILABLE. It does not deploy anything. It
  # describes the images built here from this checkout, not images another pipeline
  # builds for a deployment. Same commands locally: docker/scripts/supply-chain.sh.
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Images
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml build core-api web
      - name: SBOM
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: docker/scripts/supply-chain.sh sbom supply-chain
      - name: Vulnerability report (report only)
        continue-on-error: true
        env:
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: docker/scripts/supply-chain.sh scan supply-chain
      - name: Keep the SBOMs and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supply-chain-${{ github.sha }}
          path: supply-chain/
          # A re-run of the job replaces the artifact of the first run instead of failing on the name.
          overwrite: true
          if-no-files-found: warn
          retention-days: 90
