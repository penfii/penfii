[workspace]
resolver = "3"
exclude = ["vendor/web-push-native"]
members = [
    "apps/core-api",
    "apps/admin-cli",
    "crates/contracts",
    "crates/core",
    "crates/http-api",
    "crates/mcp",
]

[workspace.dependencies]
penfii-contracts = { path = "crates/contracts" }
penfii-core = { path = "crates/core" }
penfii-http-api = { path = "crates/http-api" }
penfii-mcp = { path = "crates/mcp" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "derive", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
argon2 = "0.5"
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
tower-http = { version = "0.6", features = ["catch-panic", "cors", "set-header", "trace"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
unicode-segmentation = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
bytes = "1"
futures-util = "0.3"
base64 = "0.22"
jsonwebtoken = "9"
yrs = "0.28.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rsa = "0.9"
# Web Push: encryption (RFC 8291) comes from this crate, written on RustCrypto, so the build needs no OpenSSL.
web-push-native = "0.5.0"
p256 = { version = "0.14", features = ["ecdh", "pkcs8"] }
tokio-tungstenite = "0.29"
# SMTP for invitation and password-reset mail. rustls with the system roots only: no native-tls/openssl/boring backend,
# and nothing that turns certificate or hostname checks off is enabled or used.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "rustls-native-certs"] }

# web-push-native with p256 0.14 (no crypto-bigint 0.5, RUSTSEC-2026-0387); see vendor/web-push-native/README.md.
[patch.crates-io]
web-push-native = { path = "vendor/web-push-native" }
