[workspace]
resolver = "3"
members = [
    "apps/core-api",
    "apps/admin-cli",
    "crates/contracts",
    "crates/core",
    "crates/http-api",
    "crates/mcp",
]

[workspace.dependencies]
penfii-contracts = { path = "crates/contracts" }
penfii-core = { path = "crates/core" }
penfii-http-api = { path = "crates/http-api" }
penfii-mcp = { path = "crates/mcp" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "macros", "derive", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
argon2 = "0.5"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
tower-http = { version = "0.7", features = ["cors", "set-header", "trace"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
unicode-segmentation = "1"
clap = { version = "4", features = ["derive"] }
bytes = "1"
futures-util = "0.3"
base64 = "0.22"
jsonwebtoken = "9"
yrs = "0.28.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rsa = "0.9"
tokio-tungstenite = "0.29"
