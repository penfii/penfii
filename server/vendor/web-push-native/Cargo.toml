[package]
name = "web-push-native"
version = "0.5.0"
edition = "2021"
rust-version = "1.87.0"
description = "web-push-native 0.5.0 (RFC 8030/8291 encryption), trimmed to the encryption path and moved to p256 0.14"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
aes-gcm = "0.10.3"
ece-native = "0.5.0"
getrandom = "0.3"
hkdf = "0.13.0"
http = "1.4.2"
p256 = { version = "0.14.0", features = ["ecdh"] }
sha2 = "0.11.0"

[dev-dependencies]
base64ct = { version = "1.8.3", features = ["alloc", "std"] }
once_cell = "1.21.4"
